<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel editorial · Aletheia News Brasil</title><meta name="robots" content="noindex">
<style>
body{font:15px/1.5 Inter,system-ui,sans-serif;background:#FBFAF7;color:#1E1D1A;margin:0}
header{border-bottom:3px solid #5E5546;padding:12px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header b{font-family:Georgia,serif;font-size:1.1rem}
main{padding:16px;max-width:1200px}
a{color:#1F5E8C} table{border-collapse:collapse;width:100%;margin:8px 0 20px}
th,td{text-align:left;border-bottom:1px solid #D9D4CA;padding:6px 8px;vertical-align:top;font-size:.875rem}
.ok{color:#2c5e3a}.bad{color:#A1221B}.muted{color:#55524B}.msg{background:#E6E2DA;padding:8px 12px;border-left:3px solid #1E1D1A}
section{border-top:1px solid #D9D4CA;margin-top:24px;padding-top:8px}
form.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
input,select,textarea,button{font:inherit;padding:6px 8px;border:1px solid #55524B;border-radius:3px;background:#fff}
button{background:#1E1D1A;color:#FBFAF7;border:0;cursor:pointer}
textarea{width:100%}.pill{font-size:.75rem;border:1px solid #55524B;border-radius:2px;padding:1px 6px}
</style></head><body>
<header><b>Aletheia News · painel editorial</b><a href="/admin">Edições</a><a href="/admin/termos">Termos carregados</a><a href="/admin/eixos">Eixos e exclusões</a><a href="/admin/entradas">Contestações e sugestões</a><span class="muted">{{ user }}</span></header>
<main>{% if msg %}<p class="msg" role="status">{{ msg }}</p>{% endif %}{% block main %}{% endblock %}</main></body></html>
