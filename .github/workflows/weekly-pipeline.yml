# Weekly pipeline (free on GitHub Actions). Runs Saturday 06:00 UTC = 03:00 BRT,
# inside the production window (Saturday 00:00 to Monday 06:00 BRT).
# Needs the repository secrets DATABASE_URL (same Neon string as on Render) and CHAT_API_KEY (Kimi key):
# Settings → Secrets and variables → Actions → New repository secret.
name: weekly-pipeline
on:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Run outside the production window"
        type: boolean
        default: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrate and run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COUNTRY: BR
          # Agents use the same model provider as the chat. The key is a repository secret.
          CHAT_PROVIDER: openai_compatible
          CHAT_BASE_URL: https://api.moonshot.ai/v1
          CHAT_MODEL: kimi-k3
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
          AGENT_BUDGET_CENTS_PER_RUN: "100"
          # Claim checker: a different model (D36). Reasoning mode off for both (D40).
          VERIFIER_MODEL: kimi-k2.6
          AGENT_THINKING: disabled
          VERIFIER_THINKING: disabled
        run: |
          alembic upgrade head
          if [ "${{ inputs.forcar }}" = "true" ]; then python -m app.pipeline.weekly --forcar; else python -m app.pipeline.weekly; fi
