name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: aletheia, POSTGRES_PASSWORD: aletheia, POSTGRES_DB: aletheia_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt pytest==9.1.1
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aletheia:aletheia@localhost:5432/aletheia_test
