# Local run: docker compose up --build   → http://localhost:8080
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
      POSTGRES_DB: aletheia
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia"]
      interval: 3s
      retries: 20
  web:
    build: .
    depends_on:
      db: {condition: service_healthy}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://aletheia:aletheia@db:5432/aletheia
      PUBLIC_BASE_URL: http://localhost:8080
    ports: ["8080:8080"]
  pipeline:
    build: .
    profiles: [pipeline]
    depends_on:
      db: {condition: service_healthy}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://aletheia:aletheia@db:5432/aletheia
    command: ["./scripts/pipeline.sh"]
volumes:
  pgdata:
